<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#0f1015" />
    </radialGradient>
    <linearGradient id="irisRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#7dcfff" />
      <stop offset="70%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="rgba(122, 162, 247, 0.25)" stroke-width="1.5" />

  <!-- Outer Optical Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#irisRing)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#irisRing)" stroke-width="2" opacity="0.85" filter="url(#glow)" />

  <!-- Aperture Blades / Iris Shutter -->
  <g stroke="url(#irisRing)" stroke-width="1.75" stroke-linecap="round" opacity="0.95" filter="url(#glow)">
    <line x1="32" y1="12" x2="45" y2="24" />
    <line x1="45" y1="24" x2="47" y2="40" />
    <line x1="47" y1="40" x2="36" y2="51" />
    <line x1="36" y1="51" x2="20" y2="47" />
    <line x1="20" y1="47" x2="15" y2="31" />
    <line x1="15" y1="31" x2="25" y2="17" />
  </g>

  <!-- Central Optical Core / Beam -->
  <circle cx="32" cy="32" r="8.5" fill="url(#coreGlow)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  
  <!-- Optical Corner Alignment Marks (QR / Camera framing homage) -->
  <path d="M 9 15 L 9 9 L 15 9" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 55 15 L 55 9 L 49 9" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 9 49 L 9 55 L 15 55" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 55 49 L 55 55 L 49 55" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
